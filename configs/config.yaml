# configs/config.yaml
# =====================
# Central configuration file for the Knee OA XAI project.
# All paths and hyperparameters are set here.
# Stage-specific sections are added as the project progresses.

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  dataset_root : "/Users/aadithyaaravishankar/Desktop/KNEE OA/dataset"
  project_root : "/Users/aadithyaaravishankar/Desktop/KNEE OA/knee_oa_xai"
  outputs      : "outputs/"
  reports      : "reports/"
  models       : "outputs/models/"
  heatmaps     : "outputs/heatmaps/"

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  kl_grades    : [0, 1, 2, 3, 4]
  image_size   : 224
  splits       : ["train", "val", "test", "auto_test"]
  img_ext      : ".png"
  color_mode   : "grayscale"   # images are single-channel

# ── Preprocessing (Stage 2) ──────────────────────────────────────────────────
preprocessing:
  clahe_clip_limit : 2.0
  clahe_tile_size  : [8, 8]
  # Normalization stats — computed from train split by compute_stats.py
  mean_1ch         : [0.578707]
  std_1ch          : [0.127051]
  mean_3ch         : [0.578707, 0.578707, 0.578707]
  std_3ch          : [0.127051, 0.127051, 0.127051]

# ── DataLoader (Stage 2) ─────────────────────────────────────────────────────
dataloader:
  batch_size           : 32
  num_workers          : 4
  use_weighted_sampler : true
  channels             : 3      # 3-channel input for ImageNet-pretrained ResNet-50
  pin_memory           : true

# ── Training (Stage 3 onwards — placeholder) ─────────────────────────────────
training:
  seed         : 42
  epochs       : 50
  lr           : 0.0001
  weight_decay : 0.0001
  early_stop_patience : 10

# ── Model (Stage 3 onwards — placeholder) ────────────────────────────────────
model:
  backbone    : "resnet50"
  pretrained  : true
  num_classes : 5
  dropout     : 0.3
